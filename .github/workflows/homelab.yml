name: Build Homelab Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.homelab'
      - 'open_terminal/**'
      - 'pyproject.toml'

env:
  IMAGE: ghcr.io/benstringer3/open-terminal:homelab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.homelab
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
